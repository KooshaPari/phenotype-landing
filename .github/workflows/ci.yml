name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  astro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - agileplus-landing
          - byteport-landing
          - hwledger-landing
          - odin-landing
          - phenokits-landing
          - projects-landing
          - thegent-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build ${{ matrix.package }}
        working-directory: sites/${{ matrix.package }}
        run: |
          bun install
          bunx astro check
          bun run build
