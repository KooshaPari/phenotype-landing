name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  astro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agileplus-landing
          - byteport-landing
          - hwledger-landing
          - phenokits-landing
          - projects-landing
          - thegent-landing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: latest
      - name: Install and build ${{ matrix.package }}
        working-directory: sites/${{ matrix.package }}
        run: |
          bun install
          bunx astro check
          bun run build
